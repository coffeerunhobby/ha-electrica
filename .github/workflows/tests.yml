name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "min — HA 2024.12 / py3.12"
            python: "3.12"
            ha: "homeassistant==2024.12.0"
          - name: "stable — py3.13"
            python: "3.13"
            ha: ""
          - name: "latest — py3.14"
            python: "3.14"
            ha: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ${{ matrix.ha }} -r requirements_test.txt
      - name: Run tests
        run: pytest -q
